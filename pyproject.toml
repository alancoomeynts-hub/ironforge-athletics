[tool.ruff]
target-version= "py312"
exclude = [
    "**/migrations",
]

[tool.ruff.lint]
select =["E", "W", "F", "I", "UP", "DJ", "RUF", "B"]
ignore=["DJ001"] # ignore null=true on CharFields being flagged by ruff

[tool.ruff.lint.per-file-ignores]
"**/admin.py" = ["RUF012"]
"**/forms.py" = ["RUF012"] #ignore recommendation to use tuples instead of lists, dicts in models, forms and migrations
"**/models.py" = ["RUF012"]
"**/migrations/*.py" = ["RUF012"]
