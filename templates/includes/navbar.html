{% url 'home:home' as home_url %}
{% url 'home:about' as about_url %}
{% url 'home:contact_us' as contact_us %}
<nav class="navbar navbar-expand-lg navbar-dark site-nav py-2 mt-2"
     aria-label="Primary navigation bar"
     role="navigation">
    <div class="container-fluid pe-5">
        <a class="site-nav__brand navbar-brand" href="{% url 'home:home' %}">
            <i class="fa-solid fa-dumbbell site-nav__icon" aria-hidden="true"></i>
            <span>IronForge Athletics</span>
        </a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#main-navbar"
                aria-controls="main-navbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navbar">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="site-nav__link nav-link {% if request.path == home_url %}active{% endif %}"
                       href="{{ home_url }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="site-nav__link nav-link {% if request.path == about_url %}active{% endif %}"
                       href="{{ about_url }}">Our Gym</a>
                </li>
                <li class="nav-item">
                    <a class="site-nav__link nav-link" href="">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="site-nav__link nav-link" href="">Community</a>
                </li>
                <li class="nav-item">
                    <a href="{{ contact_us }}" class="site-nav__link nav-link">Contact Us</a>
                </li>
            </ul>
        </div>
