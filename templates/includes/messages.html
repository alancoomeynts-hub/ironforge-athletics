{% if messages %}
    <div class="toast-container custom__toast-container p-3">
        {% for message in messages %}
            <div class="toast align-items-center custom__toast--{{ message.tags }}"
                 role="alert"
                 aria-live="assertive"
                 aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">{{ message }}</div>
                    <button type="button"
                            class="btn-close btn-close-dark me-2 m-auto"
                            data-bs-dismiss="toast"
                            aria-label="Close"></button>
                </div>
            </div>
        {% endfor %}
    </div>
{% endif %}
<div id="js-toast-container"
     class="toast-container custom__toast-container p-3"
     aria-live="polite"
     aria-atomic="true"></div>
