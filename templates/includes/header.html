<div class="container-fluid">
<div class="row align-items-center">

    <!-- Search form -->
    <div class="col-12 col-md-5 order-1 ms-auto mt-2 mt-md-0">
        <form action="" method="get" class="d-flex">
            <div class="input-group d-flex flex-row">
                <select name="page" class="form-select border-end-0 ">
                    <option value="members">Members</option>
                    <option value="shop">Shop</option>
                    <option value="community">Community</option>
                </select>
                <input type="search"
                       name="q"
                       class="form-control border-start-0"
                       placeholder="Search..."
                       aria-label="Search" />
                <button class="btn btn-outline-light" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </form>
    </div>
    <!-- Contact and Log In Links -->
    <div class="col-12 col-md-3 order-2 text-md-end mt-2 mt-md-0">
        <a href="" class="me-3">Contact Us</a>
        {% if request.user.is_authenticated %}
            <a href="">Profile</a>
            <a href="{% url 'account_signup' %}" class="dropdown-item">Register</a>
            <a href="">Log Out</a>
        {% else %}
            <a href="">Log In</a>
        {% endif %}
    </div>
</div>
</div>
