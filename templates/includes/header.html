{% url 'home:contact_us' as contact_us %}

<div class="container-fluid">
    <div class="row align-items-center">
        <!-- Search form -->
        <div class="col-12 col-md-5 order-1 ms-auto mt-2 mt-md-0">
            <form action="" method="get" class="d-flex">
                <div class="input-group d-flex flex-row">
                    <select name="page" class="form-select border-end-0">
                        <option value="members">Members</option>
                        <option value="shop">Shop</option>
                        <option value="community">Community</option>
                    </select>
                    <input type="search"
                           name="q"
                           class="form-control border-start-0"
                           placeholder="Search..."
                           aria-label="Search" />
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </form>
        </div>
        <!-- Contact and Log In Links -->
        <div class="col-12 col-md-3 site-header__links order-2 text-md-end mt-2 mt-md-0">
            <a href="{{ contact_us }}" class="site-header__link me-3">Contact Us</a>
            {% if request.user.is_authenticated %}
                <a class="site-header__link" href="">Profile</a>
                <a class="site-header__link" href="{% url 'account_signup' %}">Register</a>
                <a class="site-header__link" href="{% url 'account_logout' %}">Log Out</a>
            {% else %}
                <a class="site-header__link" href="">Log In</a>
            {% endif %}
        </div>
    </div>
</div>
