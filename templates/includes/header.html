<div class="container-fluid">
<div class="row align-items-center">
    <!-- Logo + brand -->
    <div class="col-12 col-md-4 d-flex align-items-center">
        <a href="{% url 'home:home' %}"
           class="d-flex align-items-center text-white text-decoration-none">
            <img src="" alt="Logo" height="36" class="me-2" />
            <span class="fw-bold"></span>
        </a>
    </div>
    <!-- Search form -->
    <div class="col-12 col-md-5 order-3 order-md-2 mt-2 mt-md-0">
        <form action="" method="get" class="d-flex">
            <fieldset class="d-flex flex-row">
                <select name="page" class="form-select me-2">
                    <option value="members">Members</option>
                    <option value="shop">Shop</option>
                    <option value="community">Community</option>
                </select>
                <input type="search"
                       name="q"
                       class="form-control me-2"
                       placeholder="Search..."
                       aria-label="Search" />
                <button class="btn btn-outline-light" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </fieldset>
        </form>
    </div>
    <!-- Contact and Log In Links -->
    <div class="col-12 col-md-3 order-2 order-md-3 text-md-end mt-2 mt-md-0">
        <a href="" class="me-3">Contact Us</a>
        {% if request.user.is_authenticated %}
            <a href="">Profile</a>
            <a href="{% url 'account_signup' %}" class="dropdown-item">Register</a>
            <a href="">Log Out</a>
        {% else %}
            <a href="">Log In</a>
        {% endif %}
    </div>
</div>
</div>
