{% extends "base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/shop.css' %}">
{% endblock %}
{% block content %}
    <div class="content__wrapper container py-5">
        <div class="py-5">
            <h1 class="h3 mb-1">Confirm your Order</h1>
            <p class="text-muted mb-0">Please confirm details</p>
        </div>
        <div class="row g-4">
            <div class="col-12 col-md-6">
                <form id="confirm-order__form"
                      action="{% url 'shop:confirm_order' %}"
                      method="post"
                      class="form-max-width">
                    {{ form }}
                    {% csrf_token %}
                    <div class="mt-auto d-flex flex-column align-items-center gap-2">
                        <button type="submit" class="btn w-100 mt-3 cta-btn buy-btn">Confirm Order</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
