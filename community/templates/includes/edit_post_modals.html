<!--edit post model -->
<div class="modal fade"
     id="editPostModal"
     tabindex="-1"
     aria-labelledby="editPostModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editPostForm" method="post">
                {% csrf_token %}
                <div class="modal-header">
                    <h2 class="h5 modal-title" id="editPostModalLabel">Edit post</h2>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editPostTitle" class="form-label">Title</label>
                        <input type="text"
                               id="editPostTitle"
                               name="title"
                               class="form-control"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="editPostContent" class="form-label">Content</label>
                        <textarea id="editPostContent"
                                  name="content"
                                  class="form-control"
                                  rows="5"
                                  required></textarea>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="editPostPhoto" class="form-label">Add photo</label>
                    <input type="file"
                           id="editPostPhoto"
                           name="photo"
                           accept="image/*"
                           class="form-control">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn cta-btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn cta-btn-secondary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--delete post model -->
<div class="modal fade"
     id="deletePostModal"
     tabindex="-1"
     aria-labelledby="deletePostModalLabel"
     role="dialog"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="deletePostModalLabel">Delete Post</h2>
                <button type="button"
                        class="btn-close btn-primary"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">Are you sure you want to delete this post?</p>
                <p class="text-muted mb-0" id="deletePostModalText"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn cta-btn-secondary" data-bs-dismiss="modal">Keep Post</button>
                <form id="deletePostConfirm" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn cta-btn-secondary">Delete Post</button>
                </form>
            </div>
        </div>
    </div>
</div>
