<!--edit comment model -->
<div class="modal fade"
     id="editCommentModal"
     tabindex="-1"
     aria-labelledby="editCommentModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editCommentForm" method="post">
                {% csrf_token %}
                <div class="modal-header">
                    <h2 class="h5 modal-title" id="editCommentModalLabel">Edit comment</h2>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="editCommentContent" class="form-label">Comment</label>
                    <textarea id="editCommentContent"
                              name="content"
                              class="form-control"
                              rows="4"
                              required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--delete comment model -->
<div class="modal fade"
     id="deleteCommentModal"
     tabindex="-1"
     aria-labelledby="deleteCommentModalLabel"
     role="dialog"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="deleteCommentModalLabel">Delete Comment</h2>
                <button type="button"
                        class="btn-close btn-primary"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">Are you sure you want to delete this comment?</p>
                <p class="text-muted mb-0" id="deleteCommentModalText"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn cta-btn-secondary" data-bs-dismiss="modal">Keep Comment</button>
                <form id="deleteCommentConfirm" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete Comment</button>
                </form>
            </div>
        </div>
    </div>
</div>
