{%  extends 'base.html' %}
{% load static %}

{% block content %}

    <section>
    <h1>{{ gym.name }}</h1>
    <p>{{ gym.description }}</p>
    <p>{{ gym.phone }}</p>
    <p>{{ gym.opening_hours }}</p>
    <address>{{ gym.address }}</address>
</section>

<form method="post">
    {% csrf_token %}

    {{ form.non_field_errors }}
    {{ form.as_p }}

    <button type="submit">Send message</button>
</form>

{% endblock %}
